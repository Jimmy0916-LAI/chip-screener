name: B06 market source schemas
on:
  pull_request:
    branches: [b05/tdcc-weekly-update]
    paths: ['packaging/qa/market_sources.py']
permissions:
  contents: read
jobs:
  sources:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: python -X utf8 packaging/qa/market_sources.py
