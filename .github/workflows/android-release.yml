name: Android APK Build & Verify

on:
  push:
    branches: [main, feat/android-mobile]
    paths:
      - 'mobile/**'
      - 'src/renderer/**'
      - 'data/**'
      - '.github/workflows/android-release.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run mobile backend & router unit tests
        run: |
          node --test mobile/tests/*.test.cjs

      - name: Build mobile web bundle (mobile/www)
        run: |
          python -X utf8 mobile/scripts/build_web.py

      - name: Install Capacitor dependencies and generate Android project
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          node scripts/configure_android.cjs
          npx cap sync android

      - name: Prepare release signing keystore
        id: sign
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          K_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          K_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KS_PATH="$RUNNER_TEMP/chipscreener-release.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$KS_PATH"
            echo "KEYSTORE_FILE=$KS_PATH" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$K_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$K_PASS" >> "$GITHUB_ENV"
            echo "mode=persistent" >> "$GITHUB_OUTPUT"
          else
            # 若尚未在 GitHub Secrets 設定固定金鑰，自動產生一次性自簽金鑰供直接安裝測試
            PASS="chip-$(openssl rand -hex 12)"
            keytool -genkeypair -v \
              -keystore "$KS_PATH" \
              -alias chipscreener \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=ChipScreener, OU=Mobile, O=ChipScreener, L=Taipei, C=TW"
            echo "KEYSTORE_FILE=$KS_PATH" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=chipscreener" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "mode=ephemeral" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed Release APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Compute APK metadata & SHA-256
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APK_SRC="mobile/android/app/build/outputs/apk/release/app-release.apk"
          OUT_DIR="mobile/dist"
          mkdir -p "$OUT_DIR"
          APK_NAME="ChipScreener-v${VERSION}-android-release.apk"
          cp "$APK_SRC" "$OUT_DIR/$APK_NAME"
          sha256sum "$OUT_DIR/$APK_NAME" > "$OUT_DIR/${APK_NAME}.sha256"
          cat "$OUT_DIR/${APK_NAME}.sha256"
          ls -lh "$OUT_DIR/$APK_NAME"
          echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChipScreener-${{ steps.meta.outputs.version }}-Android-APK
          path: |
            mobile/dist/*.apk
            mobile/dist/*.sha256
          if-no-files-found: error
          retention-days: 30
