name: B06 controls and watchlist checkpoint
on:
  pull_request:
    branches: [b05/tdcc-weekly-update]
    paths: ['.github/workflows/b06-checkpoint.yml']
permissions:
  contents: read
  actions: read
jobs:
  checkpoint:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8823b021653642288179d693503e941016510150
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - working-directory: packaging/windows
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl.exe -fsSL --retry 3 -H "Authorization: Bearer $env:GH_TOKEN" "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/artifacts/14799654475/zip" -o checkpoint.zip
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          if ((Get-FileHash checkpoint.zip).Hash -ne '92bb686b27fe2e8c25cd68c905e93b8fbc310f7580facf78a58e680434aefce6') {throw 'Checkpoint digest mismatch'}
          Expand-Archive checkpoint.zip -DestinationPath dist
          $exe=(Resolve-Path dist/ChipScreener.exe).Path
          New-Item -ItemType Directory evidence
          $env:LOCALAPPDATA=(New-Item -ItemType Directory "$env:RUNNER_TEMP/cp-user").FullName
          node gui.cjs $exe evidence pins-seed
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          node gui.cjs $exe evidence pins-remove
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint-evidence
          path: packaging/windows/evidence
