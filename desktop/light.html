<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>股票雷達輕量版</title>
<style>*{box-sizing:border-box}body{margin:auto;max-width:980px;padding:clamp(16px,4vw,48px);background:#101a24;color:#e4eef5;font:16px/1.6 system-ui}input,select{padding:.45em;max-width:100%}section{border-top:1px solid #456;margin-top:20px;padding:16px 0}label{display:inline-block;margin:4px}svg{background:#172736}#stocks{display:block;width:100%}</style>
<h1>股票雷達輕量版</h1><p>在股票雷達.exe 更新市場資料，點「匯出輕量資料」，再於此選擇 JSON 快照。</p>
<label>選擇資料檔 <input id="file" type="file" accept=".json,application/json"></label><p role="status" id="status"></p>
<section id="results" hidden><h2>快照總覽</h2><p id="summary"></p><label>搜尋個股 <input id="query" type="search"></label><label>條件 <select id="filter"><option value="all">全部</option><option value="pass">只看通過</option><option value="miss">未通過／待證</option><option value="unknown">資料待證</option></select></label><label>排序 <select id="sort"><option value="gain">增幅最高</option><option value="code">代號</option><option value="market">市場</option></select></label>
<select id="stocks" size="6" aria-label="股票清單"></select><h2 id="title"></h2><div id="levels"></div><label><input id="overlay" type="checkbox" checked>疊加日 K</label><div id="chart"></div><p id="detail"></p></section>
<script>
__HOLDING_CHART__
const el=id=>document.getElementById(id);
const levels=['200','400','600','1000'];
for(const band of levels){
 const label=document.createElement('label'), cb=document.createElement('input');
 cb.type='checkbox'; cb.value=band; cb.checked=band==='400'; label.append(cb,band+' 張'); el('levels').append(label);
}
let snap, byCode;
function day(d){return typeof d==='string' && /^\d{4}-\d{2}-\d{2}$/.test(d) && Number.isFinite(Date.parse(d));}
function validate(s){
 if(s.format!=='chip-radar-light'||s.version!==1) throw Error('快照版本不相容，請用 0.6.3 重新匯出。');
 if(!Array.isArray(s.stocks)||!Array.isArray(s.sessions)||!s.sessions.every(day)||!Array.isArray(s.dates)||!s.dates.every(day)||!Array.isArray(s.sources)||!s.sources.every(r=>Array.isArray(r)&&day(r[0])&&typeof r[1]==='string')) throw Error('快照缺少有效日期、來源或股票清單。');
 const seen=new Set();
 for(const r of s.stocks){
   if(!/^\d{4}$/.test(r.code)||seen.has(r.code)||typeof r.name!=='string'||typeof r.market!=='string'||typeof r.pass!=='boolean'||typeof r.unknown!=='boolean'||!(r.gain===null||Number.isFinite(r.gain))||!Array.isArray(r.weeks)||!r.weeks.every(w=>Array.isArray(w)&&day(w[0])&&(w[1]===null||Array.isArray(w[1])&&w[1].length>=10&&w[1][0]>0&&w[1].every(Number.isFinite)))||!Array.isArray(r.bars)||!r.bars.every(b=>Array.isArray(b)&&b.length===5&&day(b[0])&&b.slice(1).every(Number.isFinite)&&0<b[3]&&b[3]<=Math.min(b[1],b[4])&&Math.max(b[1],b[4])<=b[2]))throw Error('股票或圖表欄位無效。');
   seen.add(r.code);
 }
}
el('file').onchange=async e=>{
 try{const f=e.target.files[0];if(!f)return;const next=JSON.parse(await f.text());validate(next);
 snap=next;byCode=new Map(snap.stocks.map(r=>[r.code,r]));el('results').hidden=false;
 el('summary').textContent='母體 '+snap.stocks.length+' 檔，通過 '+snap.stocks.filter(r=>r.pass).length+' 檔。篩選週 '+(snap.end||'無')+'。集保期間 '+(snap.dates[0]||'無')+' 至 '+(snap.dates.at(-1)||'無')+'。';
 el('status').textContent='已載入 '+f.name; filterRows();
 }catch(err){el('status').textContent='匯入失敗。'+err.message;} e.target.value='';
};
function filterRows(){const q=el('query').value.trim().toLowerCase(),filter=el('filter').value,sort=el('sort').value;
 const rows=snap.stocks.filter(r=>(r.code+' '+r.name).toLowerCase().includes(q)&&(filter==='all'||(filter==='miss'?!r.pass:r[filter])));
 rows.sort((a,b)=>sort==='gain'?(b.gain??-9999)-(a.gain??-9999):a[sort].localeCompare(b[sort]));
 el('stocks').replaceChildren(...rows.map(r=>new Option(r.code+' '+r.name+' · '+r.market,r.code)));el('stocks').selectedIndex=rows.length?0:-1;draw();}
function draw(){const r=byCode.get(el('stocks').value);el('title').textContent=r?r.code+' '+r.name:'無符合個股';el('chart').innerHTML=r?holdingChart(r.weeks,r.bars,[...el('levels').querySelectorAll(':checked')].map(cb=>cb.value),snap.sessions,el('overlay').checked):'';el('detail').textContent=r?'日 K '+r.bars.length+' 筆。最新集保來源 '+(snap.sources.at(-1)?.[1]||'無'):'';}
for(const id of ['query','sort','filter']) el(id).oninput=filterRows;
for(const id of ['stocks','overlay','levels']) el(id).onchange=draw;
</script></html>
